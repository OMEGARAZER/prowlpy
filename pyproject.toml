[build-system]
requires = ["setuptools>=65.6.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prowlpy"
authors = [{name = "OMEGA_RAZER"}]
description = "Prowlpy is a python library that implements the public api of Prowl to send push notification to iPhones."
keywords = ["prowl", "push", "notification", "iphone"]
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11"
dependencies = [
    "pyreqwest>=0.12.0",
    "xmltodict>=0.13.0",  # Ubuntu 24.04 packaged version
]
dynamic = ["version"]

[tool.setuptools]
dynamic = {"version" = {attr = "prowlpy.prowlpy.__version__"}}
packages = ["prowlpy",]

[project.optional-dependencies]
cli = [
    "loguru>=0.7.2",  # Ubuntu 24.04 packaged version
    "typer>=0.9.0",  # Ubuntu 24.04 packaged version
]

[project.scripts]
prowlpy = "prowlpy._cli:app"

[project.urls]
"Homepage" = "https://omegarazer.github.io/prowlpy"
"Source" = "https://github.com/OMEGARAZER/prowlpy"
"Bug Reports" = "https://github.com/OMEGARAZER/prowlpy/issues"

[dependency-groups]
dev = [
    "loguru>=0.7.3",
    "prek>=0.4.0",
    "pyreqwest>=0.12.0",
    "typer>=0.25.1",
    "xmltodict>=1.0.4",
    {include-group = "lint"},
    {include-group = "type"},
    {include-group = "test"},
]
lint = [
    "refurb>=2.3.1",
    "ruff>=0.15.13",
]
type = [
    "mypy>=2.1.0",
    "pyrefly>=1.0.0",
    "pyright>=1.1.409",
    "types-xmltodict>=1.0.1.20260408",
    "ty>=0.0.37",
]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]

[tool.mypy]
files = ["prowlpy"]
python_version = "3.11"
show_column_numbers = true
show_error_context = true
strict = true

[tool.pyrefly]
errors = { missing-override-decorator = "ignore" }
preset = "strict"
project-includes = ["prowlpy"]
python-version = "3.11"

[tool.pyright]
include = ["prowlpy"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--cov=prowlpy --cov-report=term-missing"
testpaths = ["tests"]

[tool.refurb]
enable_all = true
python_version = "3.11"

[tool.ruff]
extend-exclude = []
line-length = 120
lint.flake8-annotations = {"suppress-dummy-args" = true}
lint.ignore = ["CPY", "D212", "EM", "FBT001", "TRY0"]
lint.per-file-ignores = {"tests/*" = ["ARG001", "DOC201", "DOC402", "DOC501", "INP001", "S101", "S105"], "Examples/*" = ["INP", "T201"]}
lint.pydocstyle = {"convention" = "google"}
lint.pylint = {"allow-magic-value-types" = ["bytes", "int", "str"], "max-args" = 8, "max-positional-args" = 8}
lint.select = ["ALL"]
output-format = "full"
preview = true
show-fixes = true
target-version = "py311"

[tool.ty]
rules.no-matching-overload = "ignore"
terminal.output-format = "full"
